[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-ai-copilot"
version = "1.0.0"
description = "On-call assistant that checks whether a runbook is still true before suggesting recovery commands"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "qdrant-client",
    "google-genai",
    "ddgs",
    "python-dotenv",
]

[project.optional-dependencies]
cli = ["requests", "typer", "rich"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
copilot = "copilot.cli:app"

[tool.setuptools]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
