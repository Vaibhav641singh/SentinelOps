[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-ai-copilot"
version = "1.0.0"
description = "On-call assistant that checks whether a runbook is still true before suggesting recovery commands"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "qdrant-client",
    "google-genai",
    "ddgs",
    "python-dotenv",
]

[project.optional-dependencies]
cli = ["requests", "typer", "rich"]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Only the eval harness needs numpy — it is not a runtime dependency, and the
# deployed image must not carry it.
eval = ["numpy"]

[project.scripts]
copilot = "copilot.cli:app"

[tool.setuptools]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pinned explicitly rather than left to ruff's default. The default set widens
# between releases, so an unpinned CI job starts failing on code nobody touched.
# This is ruff's current default plus import sorting. Widening it to E501 or B
# is a worthwhile cleanup, but it is a reformat of the whole package rather than
# a lint fix, so it belongs in its own change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
